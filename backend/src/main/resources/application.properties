spring.application.name=neon-void
server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/neon_void}
spring.datasource.username=${DATABASE_USERNAME:neon_void}
spring.datasource.password=${DATABASE_PASSWORD:neon_void}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
